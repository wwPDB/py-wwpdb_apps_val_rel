[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wwpdb.apps.val_rel"
dynamic = ["version"]
description = "wwPDB validation processing for weekly release"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Ezra Peisach", email = "ezra.peisach@rcsb.org" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
]
dependencies = [
    "filelock",
    "mmcif",
    "oslo_concurrency",
    "requests",
    "urllib3",
    "wwpdb.apps.validation ~= 2.49",
    "wwpdb.io >=1.2, < 2.0",
    "wwpdb.utils.config >= 0.24",
    "wwpdb.utils.detach",
    "wwpdb.utils.dp",
    "wwpdb.utils.message_queue ~= 0.6",
    "wwpdb.utils.nmr",
    "wwpdb.utils.session",
    "wwpdb.utils.ws_utils",
]

requires-python = ">=3.8"


[project.optional-dependencies]
dev = [
    "check-manifest",
]
test = [
    "coverage",
]

[project.urls]
Homepage = "https://github.com/wwpdb/py-wwpdb_apps_val_rel"

[tool.hatch.version]
path = "wwpdb/apps/val_rel/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/wwpdb",
]

[tool.hatch.build.targets.wheel]
packages = ["wwpdb"]

#=================================== Ruff basics =============================#
[tool.ruff]
target-version = "py38"
output-format = "concise"

line-length = 120 # 120 is hatch's default via 'hatch init'
include = [
  "*.py",           # Source
  "pyproject.toml", # This file (RUF rules only)
  "*.ipynb",        # Jupyter notebooks
]

#
#=================================== Ruff lint ==============================#

[tool.ruff.lint]

#
# ------------------------- Ruff misc. options ----------------------
preview = false
explicit-preview-rules = true

ignore = [
  "C402",     #  Unnecessary generator (rewrite as a `dict` comprehension)
  "EXE001",   # Shebang is present but file is not executabl
  "FA100",    # Add `from __future__ import annotations` to simplify `typing.Optional`
  "FBT002",   # Boolean default positional argument in function definition
  "FBT001",   # Boolean-typed positional argument in function definition
  "FURB113",  # Use `stPL.extend(...)` instead of repeatedly calling `stPL.append()`
  "INP001",   # File `xx` is part of an implicit namespace package. Add an `__init__.py
  "N801",     # Class name `markdownTests` should use CapWords convention
  "N802",     # Function name should be lowercase
  "N803",     # Argument name should be lowercase
  "N806",     # in function should be lowercase
  "N815",     # Caiable... in class shope should not be mixedCase
  "N816",     # Variable in global scope should not be mixedCase
  "N999",     # Invalid module name,
  "PERF401",  # Use a list comprehension to create a transformed list
  "PERF403",  #  Use a dictionary comprehension instead of a for-loop
  "PLR1714",  # Consider merging multiple comparisons
  "PLR2004",  # Magic value used in comparison, consider replacing
  "PLR6201",  # Use a `set` literal when testing for membership
  "PLR6301",  # Method `` could be a function, class method, or static method
  "PLW1514",  # `open` in text mode without explicit `encoding` argument
  "PT009",    # Use a regular `assert` instead of unittest-style `assertGreater`
  "RET504",   # Unnecessary assignment to `X` before `return` statement
  "PT027",    # Use `pytest.raises` instead of unittest-style `assertRaises`
  "RUF100",   # RUF REMOVES FLAKE8 noqa!
  "S110",     # `try`-`except`-`pass` detected, consider logging the exception
  "SIM102",   # Use a single `if` statement instead of nested `if` statements
  "SIM103",   #  Return the condition directly
  "SIM108",   # Use ternary operator
  "SIM115",   # Use context handler for opening files
  "TRY300",   # Consider moving this statement to an `else` block
  "TRY400",   # Use `logging.exception` instead of `logging.error`
  "TRY401",   # Redundant exception object included in `logging.exception` call
  "UP008",    # Use `super()` instead of `super(__class__, self)`
  "UP031",    # Use format specifiers instead of percent format
  "UP036"     # Version block is outdated for minimum Python version
]

# -------------------- default environment scripts ------------------
[tool.hatch.envs.default]
skip-install = true
dependencies = ["mypy", 
    "ruff >=0.6.9",
    "wwpdb.utils.config", 
    "wwpdb.utils.message_queue",
    "wwpdb.io", 
    "wwpdb.utils.dp", 
    "wwpdb.utils.session", 
    "wwpdb.utils.detach"
]


[tool.hatch.envs.default.scripts]

# 'format' formats and fixes issues but does not complain
format = [
  "ruff format",
  "ruff check --fix-only",
]

# 'format-python' just excludes Prettier
format-python = ["ruff format", "ruff check --fix-only"]

# 'check' only checks but never fixes
check = ["ruff check --no-fix .", "mypy --non-interactive --install-types -p wwpdb -p tests --strict"]

# only checks with ruff (mypy has a lot of false positives)
check-ruff = "ruff check --no-fix . {args}"

# to complement 'check-ruff'
check-mypy = "mypy --non-interactive --install-types -p wwpdb -p tests {args}"

# only check security via Bandit; we require these rules to pass
check-security = "ruff check --select S --no-fix ."

# -----------------------  testing environment ----------------
[tool.hatch.envs.hatch-test]
dependencies = ["tox"]

[tool.hatch.envs.hatch-test.scripts]
run = ["tox"]


# -------------------------  Mypy disable ---------
[[tool.mypy.overrides]]
module = ["oslo_concurrency.*", "wwpdb.io.*", "mmcif.*", "wwpdb.utils.ws_utils.*", "wwpdb.utils.dp.*", "wwpdb.apps.validation.*", "wwpdb.utils.detach.*","wwpdb.utils.message_queue.*", "wwpdb.utils.session.*", "filelock"]
ignore_missing_imports = true

[tool.mypy]
exclude = [
	"test-output",
]

# ------------------------ ruff disable until typing added
[tool.ruff.lint.per-file-ignores]
"wwpdb/apps/val_rel/utils/check_results.py" = ["T201", "T203"]  # Command line script
"tests/test_get_files_release_ftp_emdb.py" = ["T201"]
